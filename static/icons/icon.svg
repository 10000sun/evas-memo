<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 꽉 찬 정사각형: iOS·안드로이드가 알아서 모서리를 깎는다. 그림은 가운데 70% 안에 둔다(마스크 안전 영역). 캘린더(파랑)와 같은 결, 색만 초록 -->
  <rect width="512" height="512" fill="#0ca678"/>
  <!-- 메모지: 오른쪽 위 모서리를 접은 흰 종이 -->
  <rect x="100" y="100" width="312" height="312" rx="36" fill="#ffffff"/>
  <path d="M340 100H412V172z" fill="#0ca678"/>
  <path d="M340 100V172H412z" fill="#c3fae8"/>
  <!-- 글줄: 캘린더의 일정 막대와 같은 범주색 막대. 작은 크기에서도 줄무늬로 읽힌다 -->
  <rect x="148" y="200" width="170" height="30" rx="15" fill="#e57373"/>
  <rect x="148" y="252" width="200" height="30" rx="15" fill="#ffb74d"/>
  <rect x="148" y="304" width="140" height="30" rx="15" fill="#81c784"/>
  <rect x="148" y="356" width="180" height="30" rx="15" fill="#64b5f6"/>
</svg>
